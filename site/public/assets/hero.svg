      <text x="1368" y="181" text-anchor="end" fill="#55785B" font-size="17" font-weight="500">+4 <tspan fill="#9D786A">−1</tspan></text>
      <path d="M830 201H1396" stroke="#DFE2D9"/>
      <rect x="831" y="202" width="565" height="39" fill="#E8ECF0"/>
      <text x="855" y="228" fill="#6B7F94" font-family="'Cascadia Mono', Consolas, monospace" font-size="16">@@ −1,3 +1,6 @@</text>
