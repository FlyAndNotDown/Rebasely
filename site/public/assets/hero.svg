        <text x="646" y="416" fill="#7D845A" font-weight="600">M</text><text x="670" y="416" fill="#364B38">search.ts</text>
        <text x="646" y="452" fill="#4C805B" font-weight="600">A</text><text x="670" y="452" fill="#677361">search.test.ts</text>
        <text x="646" y="488" fill="#7D845A" font-weight="600">M</text><text x="670" y="488" fill="#677361">palette.css</text>
