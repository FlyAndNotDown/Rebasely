      <rect x="831" y="316" width="565" height="144" fill="#E0EDDF"/>
      <path d="M884 241V496" stroke="#D1DACD"/>
      <g font-family="'Cascadia Mono', Consolas, monospace" font-size="17">
        <g fill="#929D8C" text-anchor="end"><text x="870" y="266">1</text><text x="870" y="302">2</text><text x="870" y="338">2</text><text x="870" y="374">3</text><text x="870" y="410">4</text><text x="870" y="446">5</text><text x="870" y="482">6</text></g>
        <text x="901" y="266" fill="#525D51"><tspan fill="#726297">export function</tspan> search(query) {</text>
        <text x="898" y="302" fill="#986F61">−</text><text x="922" y="302" fill="#88695D">return items;</text>
        <text x="898" y="338" fill="#56805C">+</text><text x="922" y="338" fill="#43694A">const term = query.trim();</text>
        <text x="898" y="374" fill="#56805C">+</text><text x="922" y="374" fill="#43694A">return items.filter(item =&gt;</text>
        <text x="898" y="410" fill="#56805C">+</text><text x="942" y="410" fill="#43694A">item.title.includes(term)</text>
        <text x="898" y="446" fill="#56805C">+</text><text x="922" y="446" fill="#43694A">);</text>
        <text x="901" y="482" fill="#525D51">}</text>
      </g>
      <path d="M830 510H1396" stroke="#DFE2D9"/>
      <text x="855" y="530" fill="#83907D" font-size="12" letter-spacing=".4">WORKING TREE</text>
      <circle cx="647" cy="558" r="4" fill="#6C9D79"/>
      <text x="661" y="563" fill="#6E7C67" font-size="14">Your tools. Your workflow.</text>
      <text x="1373" y="563" text-anchor="end" fill="#829079" font-size="14">3 files changed</text>
