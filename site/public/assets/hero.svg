<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rebasely — Git and Perforce, in one clear workspace</title>
  <desc id="desc">The Rebasely branch mark and the words Every change. One clear view. sit beside an illustrated desktop workspace with Git and Perforce tabs, changed files, and a highlighted code diff.</desc>
  <defs>
    <clipPath id="banner"><rect width="1440" height="620" rx="20"/></clipPath>
    <clipPath id="workspace"><rect x="622" y="44" width="774" height="532" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#banner)">
    <rect width="1440" height="620" fill="#1B1D1C"/>
    <path d="M590 0V620" stroke="#353936"/>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="56" y="56" width="56" height="56" rx="14" fill="#272A28" stroke="#4B514C"/>
      <g transform="translate(69 69) scale(1.25)" stroke="#F3F2EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3v12M18 6a6 6 0 0 1-6 6H6"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      </g>
      <text x="130" y="101" fill="#F3F2EC" font-size="54" font-weight="600" letter-spacing="-2.6">Rebasely</text>
      <text x="56" y="203" fill="#A9B6AC" font-size="16" font-weight="600" letter-spacing="2.1">GIT + PERFORCE</text>
      <text x="53" y="279" fill="#F3F2EC" font-size="61" font-weight="500" letter-spacing="-2.8">Every change.</text>
      <text x="53" y="349" fill="#F3F2EC" font-size="61" font-weight="500" letter-spacing="-2.8">One clear view.</text>
      <text x="56" y="410" fill="#AEB5AF" font-size="23" letter-spacing="-.35">Review the details.</text>
      <text x="56" y="444" fill="#AEB5AF" font-size="23" letter-spacing="-.35">Understand the history.</text>
      <text x="56" y="478" fill="#AEB5AF" font-size="23" letter-spacing="-.35">Prepare your next change.</text>
      <path d="M56 551H88" stroke="#A7D3BA" stroke-width="3"/>
      <text x="102" y="557" fill="#BFC5BF" font-size="16" letter-spacing=".2">A unified version control client</text>
