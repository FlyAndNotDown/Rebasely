<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rebasely</title>
  <desc id="desc">A unified version control client. Luminous revision paths converge across a deep, dark grid.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1440" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#202020"/><stop offset=".55" stop-color="#151515"/><stop offset="1" stop-color="#1B1B1B"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#71717A" stop-opacity=".13"/><stop offset="1" stop-color="#71717A" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="650" y1="240" x2="1410" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#3E6DA8" stop-opacity="0"/><stop offset=".3" stop-color="#79AEF2"/><stop offset=".8" stop-color="#A8CEFF"/><stop offset="1" stop-color="#79AEF2" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset=".2" stop-color="white"/><stop offset=".85" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#A1A1AA" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <mask id="graph"><rect x="620" width="820" height="480" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect width="1440" height="480" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1440" height="480" fill="url(#surface)"/>
    <ellipse cx="1100" cy="250" rx="580" ry="370" fill="url(#light)"/>
    <g mask="url(#graph)">
      <rect x="620" width="820" height="480" fill="url(#grid)"/>
      <path d="M620 240H1440" stroke="url(#line)" stroke-width="2"/>
      <path d="M730 240C810 240 810 132 890 132H1440M946 132C1026 132 1026 240 1106 240" stroke="#88B7F4" stroke-width="1.5"/>
      <path d="M826 240C906 240 906 350 986 350H1440" stroke="#9A9EC5" stroke-width="1.5"/>
      <g fill="#18181B" stroke="#98C5FF" stroke-width="1.5"><circle cx="730" cy="240" r="6"/><circle cx="826" cy="240" r="6"/><circle cx="1106" cy="240" r="7"/><circle cx="1242" cy="240" r="6"/><circle cx="890" cy="132" r="6"/><circle cx="946" cy="132" r="6"/><circle cx="1192" cy="132" r="6"/><circle cx="986" cy="350" r="6"/><circle cx="1106" cy="350" r="6"/><circle cx="1336" cy="350" r="6"/></g>
      <circle cx="1106" cy="240" r="3" fill="#DAECFF"/><circle cx="1192" cy="132" r="2" fill="#98C5FF"/>
      <path d="M1106 214V204M1106 266V276M1080 240H1070M1132 240H1142" stroke="#A1C9FC" stroke-opacity=".45"/>
      <g fill="#A1A1AA" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="2"><text x="1110" y="105">HISTORY</text><text x="1198" y="221">HEAD</text><text x="1160" y="382">WORKSPACE</text></g>
    </g>
    <rect x="76" y="76" width="58" height="58" rx="14" fill="#18181B" stroke="#3F3F46"/>
    <g transform="translate(89 89) scale(1.35)" stroke="#F4F4F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 6a6 6 0 0 1-6 6H6"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></g>
    <text x="72" y="264" fill="#F4F4F5" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="600" letter-spacing="-5">Rebasely</text>
    <text x="78" y="316" fill="#A1A1AA" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" letter-spacing="-.3">A unified version control client.</text>
    <path d="M78 383H110" stroke="#7DA8E0"/><text x="124" y="387" fill="#71717A" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="2.8">EVERY CHANGE. ONE CLEAR VIEW.</text>
    <rect x=".5" y=".5" width="1439" height="479" rx="15.5" stroke="#3F3F46"/>
  </g>
</svg>
