<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <script>
      (() => {
        let theme = "dark";
        try {
          const saved = localStorage.getItem("rebaseraven-site-theme");
          if (["light", "dark", "system"].includes(saved)) theme = saved;
        } catch {
          // Keep the default when browser storage is unavailable.
        }
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0a0a0a" : "#fafafa";
        document.documentElement.dataset.siteTheme = theme;
      })();
    </script>
    <!--site-metadata-->
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
