[package]
name = "rebasely"
version = "0.0.1"
description = "A desktop client for Git and Perforce"
edition = "2021"

[lib]
name = "rebasely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
notify = "6.1"
getrandom = "0.4"
regex = "1"
tauri-plugin-opener = "=2.5.3"
tempfile = "3"
url = "2"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
