name: Website

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
    secrets:
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Dependencies
        run: npm ci
      - name: Resolve installer links
        id: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          endpoint="latest"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            endpoint="tags/$RELEASE_TAG"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$endpoint" |
            node scripts/site-release-downloads.mjs
      - name: Build site
        env:
          VITE_GA_APP_MEASUREMENT_ID: ${{ vars.GA_APP_MEASUREMENT_ID }}
          VITE_GA_WEBSITE_MEASUREMENT_ID: ${{ vars.GA_WEBSITE_MEASUREMENT_ID }}
          VITE_RELEASE_DOWNLOADS: ${{ steps.downloads.outputs.release }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const app = process.env.VITE_GA_APP_MEASUREMENT_ID ?? "";
          const website = process.env.VITE_GA_WEBSITE_MEASUREMENT_ID ?? "";
          for (const id of [app, website]) assert.match(id, /^G-[A-Z0-9]{4,20}$/, "Missing or invalid analytics destination.");
          assert.notEqual(app, website, "Desktop and website analytics must use separate destinations.");
          JS
          npm run check:site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  index:
    name: Submit sitemap
    needs: deploy
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configuration
        id: configuration
        env:
          IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const provider = Boolean(process.env.IDENTITY_PROVIDER);
          const account = Boolean(process.env.SERVICE_ACCOUNT);
          if (provider !== account) throw new Error('Search Console configuration is incomplete.');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${provider && account}\n`);
          if (!provider) console.log('::notice::Sitemap submission is not configured; skipping.');
          NODE
      - name: Google authentication
        if: steps.configuration.outputs.enabled == 'true'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit
        if: steps.configuration.outputs.enabled == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          SEARCH_CONSOLE_PROPERTY: ${{ vars.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
        run: node scripts/submit-sitemap.mjs
